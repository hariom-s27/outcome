[project]
name = "docextract"
version = "0.1.0"
description = "Document extraction service (Outcome take-home)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit==4.7.0",
    "ruff==0.17.4",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["contract", "tools/validate.py", "sample", "cache", "_freshclone"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
