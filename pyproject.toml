[project]
name = "docextract"
version = "0.1.0"
description = "Document extraction service (Outcome take-home)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.0",
    "psycopg[binary]==3.3.8",
    "python-multipart==0.0.33",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "ruff==0.17.4",
    "schemathesis==4.33.1",
    "testcontainers[postgres]==4.15.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["contract", "tools/validate.py", "sample", "cache", "_freshclone"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
