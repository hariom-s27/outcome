# The only models the service may call (ASSIGNMENT §3; P2-02). Ids are sent byte-for-byte (R28).
# Code refuses any id not listed here. Prices are USD per million tokens.
# price_source: "card" = research §8 card (7 Nov); "snapshot" = config/models_snapshot.json.
# reasoning (P2-31): "default" = send no parameter; "none" = send reasoning {"effort": "none"}
#   only when the snapshot lists reasoning for the model and it is not mandatory (else nothing).
#   A 400 to it -> one retry without, ledger flag reasoning_param_dropped.
# response_format: true only when the /models snapshot lists it (P2-05 ladder).
# price_cliff: whole request billed at multiplier x when prompt tokens >= threshold (R22).
# estimate (P2-36): high-side input-token estimate before every call, for the per-doc $ fuse.
#   chars_per_token 1.5: P2 DEV calls measured sheet rows at ~1.75 and prose at ~2.6 chars per
#   real token, so 3 would undercount; image_tokens: per page image; margin added on top.
estimate: {chars_per_token: 1.5, image_tokens: 2600, margin: 0.15}
baseline: anthropic/claude-haiku-5.5
fallback_order:
  - anthropic/claude-haiku-5.5
  - z-ai/glm-5.3-flash
  - google/gemini-3.8-flash
  - qwen/qwen3-vl-235b-a22b-instruct
  - openai/gpt-6-luna
  - deepseek/deepseek-v3.2
  - google/gemini-3.1-pro-preview
  - anthropic/claude-sonnet-5.5
  - openai/gpt-6.1-sol
models:
  anthropic/claude-haiku-5.5:
    vision: true
    price_in: 0.1
    price_out: 0.5
    price_source: snapshot
    price_cliff: {prompt_tokens: 100000, multiplier: 5.0}
    reasoning: none
    response_format: true
    max_tokens: 4096
  openai/gpt-6-luna:
    vision: true
    price_in: 0.1
    price_out: 0.5
    price_source: snapshot
    reasoning: default
    response_format: true
