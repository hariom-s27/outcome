# The only models the service may call (ASSIGNMENT §3; P2-02). Ids are sent byte-for-byte (R28).
# Code refuses any id not listed here. Prices are USD per million tokens.
# price_source: "card" = research §8 card (7 Nov); "snapshot" = config/models_snapshot.json.
# reasoning (P2-31): "default" = send no parameter; "none" = send reasoning {"effort": "none"}
#   only when the snapshot lists reasoning for the model and it is not mandatory (else nothing).
#   A 400 to it -> one retry without, ledger flag reasoning_param_dropped.
# response_format: true only when the /models snapshot lists it (P2-05 ladder).
# price_cliff: whole request billed at multiplier x when prompt tokens >= threshold (R22).
# estimate (P2-36): high-side input-token estimate before every call, for the per-doc $ fuse.
#   chars_per_token 1.5: everything that is not a document block (instructions, field list);
#   image_tokens: per page image; margin added on top.
#   chars_per_token_by_kind (P3-18): document blocks by token class = A9 measurement - 10%
#   (sheet/table rows 1.78 -> 1.6, prose 2.96 -> 2.66). Used by the prompt cap and the fuse;
#   the after-call check against usage.prompt_tokens stays.
estimate:
  chars_per_token: 1.5
  chars_per_token_by_kind: {row: 1.6, prose: 2.66}
  image_tokens: 2600
  margin: 0.15
# output_tokens (P5-18): max_tokens for one extraction call = base + per_field x fields,
#   never above cap. cap also bounds the single PR-75 retry (x2) after a truncated, unusable
#   answer. per_field sized for the evidence-first answer {q, loc, v, conf} per field.
output_tokens:
  base: 512
  per_field: 96
  cap: 16384
# call_cap (P5 D-4): per-document call cap for PDFs = max(LLM_MAX_CALLS_PER_DOC,
#   calls_base + calls_per_batch x ceil(pages / 8)); 25 pages -> 12. Other file types keep
#   LLM_MAX_CALLS_PER_DOC (8). The per-document $ fuse is unchanged.
call_cap:
  calls_base: 4
  calls_per_batch: 2
# two_digit_year_pivot (P5 D-3, DR15): fixed, never from today's date. 00..76 -> 20xx,
#   77..99 -> 19xx; then the field's year range, one century flip, else null.
two_digit_year_pivot: 76
